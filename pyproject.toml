[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sarcodec"
version = "1.0.0"
description = "SAR image compression using learned autoencoders"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "SAR Codec Authors"}
]
keywords = [
    "sar",
    "compression",
    "autoencoder",
    "sentinel-1",
    "geospatial",
    "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: GIS",
]

# Core dependencies (minimal for inference)
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "rasterio>=1.3",
    "rich>=13.0",
]

[project.optional-dependencies]
# GPU inference with ONNX Runtime
gpu = [
    "onnxruntime-gpu>=1.17",
]

# ONNX export (includes onnx package)
export = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
]

# REST API serving
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "aiofiles>=24.1",
]

# Full installation (everything)
full = [
    "sarcodec[gpu,export,api]",
]

# Development dependencies
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
sarcodec = "sarcodec.cli:main"

[project.urls]
Homepage = "https://github.com/username/sarcodec"
Documentation = "https://github.com/username/sarcodec#readme"
Repository = "https://github.com/username/sarcodec"
Issues = "https://github.com/username/sarcodec/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sarcodec"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/LICENSE",
    "/README.md",
]

# Tool configurations
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
